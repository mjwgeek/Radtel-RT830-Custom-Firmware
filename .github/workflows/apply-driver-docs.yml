name: Apply RT-830 driver and docs update

on:
  push:
    paths:
      - '.github/workflows/apply-driver-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install updated CHIRP driver
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/driver.gz.b64 <<'B64'

B64
          base64 -d /tmp/driver.gz.b64 | gzip -d > chirp/radtel_rt830_custom.py
          echo 'f57d841b2ab08ee4f0d320e2655108942689d7f3f20cc993eff734800a578894  chirp/radtel_rt830_custom.py' | sha256sum -c -

      - name: Update README documentation
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('README.md')
          s = p.read_text()
          s = s.replace(
              'Custom firmware and CHIRP support for the **Radtel RT-830**, with expanded receive/VFO coverage, full-resolution frequency display, channel names, four modulation modes, and additional radio controls exposed through CHIRP.',
              'First public release of the custom firmware and matching CHIRP driver for the **Radtel RT-830 / Abbree AR-830 / iRadio UV-83**.\n\nThe project adds expanded receive/VFO coverage, full-resolution frequency display, channel names, four modulation modes, and additional radio controls exposed through CHIRP.')
          s = s.replace('- Simplex, `+`, `-`, and split TX frequencies', '- Simplex, `+`, `-`, split, and CHIRP `off` (receive-only) TX behavior')
          marker = '### Full VFO-A / VFO-B support\n'
          addition = '''### Voice removed and repurposed as CName\n\nThe stock firmware's **Voice** subsystem was removed from this custom build. Static analysis identified a self-contained voice-code region, and its entry point was replaced with a return stub, reclaiming roughly **2.3 KB of flash** for custom firmware features.\n\nThe former Voice-enable configuration bit is now repurposed as the **CName (Channel Name) display override**. In CHIRP this is presented as **Channel Display -> CH Name**. When enabled, the radio displays the custom 8-character memory name instead of the normal channel-number display. The three useful display choices exposed by CHIRP are:\n\n- Channel number\n- Frequency\n- Channel name (CName)\n\nThis means the original spoken Voice feature is intentionally no longer available in this firmware; its control bit now serves the channel-name display feature.\n\n### NOAA scanning change\n\nThe stock firmware automatically calls its **next NOAA channel** routine while in NOAA scanning. This custom build disables that automatic next-channel call, effectively **parking NOAA on the selected/current weather channel instead of continuously advancing through the stock NOAA list**.\n\nThe original NOAA EEPROM records at `0x0A30-0x0ADF` are deliberately preserved; the custom channel-name table begins later at `0x0AE0`, so CName storage does not overwrite the stock NOAA table.\n\nAt this stage the change is primarily to the NOAA scan/control behavior. **Audible NOAA reception is not yet implemented/verified in this build**; improving that is a planned follow-up.\n\n'''
          if '### Voice removed and repurposed as CName' not in s:
              s = s.replace(marker, addition + marker)
          offnote = '''\n### CHIRP Duplex `off`\n\nThe custom driver supports CHIRP's standard **Duplex = `off`** setting for receive-only memories. On this radio, `off` maps to the RT-830's per-channel **TX Limit / TX-inhibit** bit. A simplex memory with TX inhibit set reads back in CHIRP as `off`; repeater or split memories with TX Limit manually enabled retain their programmed duplex/offset information.\n\nExpanded frequencies outside the original 100-520 MHz operating window remain RX-only regardless of the checkbox state because both the driver and matching firmware enforce that protection.\n'''
          if '### CHIRP Duplex `off`' not in s:
              s = s.replace('## Radio settings exposed in CHIRP\n', offnote + '\n## Radio settings exposed in CHIRP\n')
          s = re.sub(r'(### CHIRP driver\n\n```text\nSHA-256  )[0-9a-f]{64}(\n```)', r'\1f57d841b2ab08ee4f0d320e2655108942689d7f3f20cc993eff734800a578894\2', s)
          p.write_text(s)

      - name: Commit repository update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chirp/radtel_rt830_custom.py README.md
          git rm .github/workflows/apply-driver-docs.yml
          git commit -m 'Add CHIRP duplex-off support and document CName/NOAA changes'
          git push
