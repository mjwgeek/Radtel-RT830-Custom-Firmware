name: Publish RT-830 v1.0.0 release

on:
  push:
    paths:
      - '.release-upload/READY'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify exact tested updater
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/chunk-* > /tmp/updater.exe.xz.b64
          base64 --decode /tmp/updater.exe.xz.b64 > /tmp/updater.exe.xz
          echo 'c713845a5340144fc5392d8ab03fcf5fd4261953f321129972016988379cf04c  /tmp/updater.exe.xz' | sha256sum -c -
          xz -dc /tmp/updater.exe.xz > /tmp/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe
          echo '90b3cbeca909ee083de175611d7f1b17472b2a7b6d43a83c78955b7a1d070d84  /tmp/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe' | sha256sum -c -

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # Radtel RT-830 Custom Firmware v1.0.0

          First public release of the matching RT-830 custom firmware and CHIRP driver.

          Highlights include expanded 18-620 MHz and 840-1200 MHz receive/VFO coverage, 10 Hz stored frequency resolution, improved A/B frequency display including 1 GHz+ values, 8-character channel names, FM/NFM/AM/NAM per-memory modulation, VFO-A/VFO-B support, and PF2 long-press modulation cycling.

          Frequencies outside the original RT-830 100-520 MHz operating window are RX-only in this project. The custom CHIRP driver sets TX Limit and the matching firmware blocks PTT outside that original window.

          **Firmware updater SHA-256:**
          `90b3cbeca909ee083de175611d7f1b17472b2a7b6d43a83c78955b7a1d070d84`

          See the repository README for installation instructions, CHIRP setup, feature details, and safety notes.
          EOF

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 --title 'Radtel RT-830 Custom Firmware v1.0.0' --notes-file /tmp/release-notes.md
            gh release upload v1.0.0 /tmp/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe --clobber
          else
            gh release create v1.0.0 /tmp/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe --target main --title 'Radtel RT-830 Custom Firmware v1.0.0' --notes-file /tmp/release-notes.md
          fi

      - name: Remove one-time upload staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .release-upload
          git rm .github/workflows/materialize-updater.yml
          git commit -m 'Remove one-time v1.0.0 release staging'
          git push
