name: Materialize firmware updater

on:
  push:
    paths:
      - '.release-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify updater
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/chunk-* > /tmp/updater.zip.b64
          base64 --decode /tmp/updater.zip.b64 > /tmp/updater.zip
          echo '7fda5298f711b504f3da518612959d200f0d9cf1b8968e2a7c28740837861120  /tmp/updater.zip' | sha256sum -c -
          unzip -t /tmp/updater.zip
          mkdir -p firmware
          unzip -o /tmp/updater.zip -d firmware
          echo '90b3cbeca909ee083de175611d7f1b17472b2a7b6d43a83c78955b7a1d070d84  firmware/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe' | sha256sum -c -

      - name: Commit exact verified updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .release-upload
          git add firmware/Radtel_RT830_Custom_Firmware_Updater_v1.0.0.exe
          git commit -m 'Add verified RT-830 custom firmware updater v1.0.0'
          git push
